policies:
  effects:
    mode: compatibility
    typed:
      rules:
        - id: deny_ci_postgresql_schema_mutation
          selector:
            kind: database_schema_mutation
            actions: [apply_migration_set]
            resource:
              match: exact
              engine: postgresql
              namespace:
                authority: dns:github.com
                organization: outline
                repository: outline
                environment: ci
              schema: public
          decision: deny
