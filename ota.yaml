version: 1
project:
  name: outline
  description: Outline local contributor readiness slice
metadata:
  ota:
    minimum_version: "1.6.20"
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: ephemeral
      container:
        image: node:24-bookworm
        engines:
          - docker
          - podman
      attachments:
        isolated_paths:
          - node_modules
          - .yarn/install-state.gz
toolchains:
  node:
    version: "24"
    package_managers:
      yarn: "4.11.0"
    fulfillment:
      source: corepack
      mode: run
tasks:
  setup:
    context: host
    description: Install Yarn dependencies exactly from the lockfile
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: yarn
        mode: install
        frozen_lockfile: true
    execution:
      default_mode: native
      modes:
        container:
          context: app
    effects:
      writes:
        - node_modules
        - .yarn/install-state.gz
      network: true
      network_kind: dependency_hydration
    requirements:
      toolchains:
        - node
    notes: Use this before running Outline checks through Ota.
  lint:
    context: host
    description: Run the TypeScript-aware Oxlint surface
    command:
      exe: corepack
      args:
        - yarn
        - lint
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
    safe_for_agent: true
    notes: Maps to the repository CI lint command.
  typecheck:
    context: host
    description: Run the CI TypeScript check
    command:
      exe: corepack
      args:
        - yarn
        - tsc
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
    safe_for_agent: true
    notes: CI runs `yarn tsc` even though it is not exposed as a package script.
  format:check:
    context: host
    description: Check Prettier formatting without modifying files
    command:
      exe: corepack
      args:
        - yarn
        - format:check
    depends_on:
      - setup
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
    notes: Diagnostic formatting check only; current upstream formatting drift keeps this outside the default agent proof path.
  format:
    context: host
    description: Rewrite files with Prettier
    command:
      exe: corepack
      args:
        - yarn
        - format
    depends_on:
      - setup
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
    notes: Human-maintainer task; prefer `ota run format:check` for agent verification.
  test:app:
    context: host
    description: Run frontend Vitest coverage
    command:
      exe: corepack
      args:
        - yarn
        - test:app
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
    safe_for_agent: true
    notes: Matches the app test lane from Outline CI.
  test:shared:
    context: host
    description: Run shared package Vitest coverage
    command:
      exe: corepack
      args:
        - yarn
        - test:shared
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
    safe_for_agent: true
    notes: Matches the shared test lane from Outline CI.
  test:server:
    context: host
    description: Run backend Vitest coverage against the local Postgres service
    command:
      exe: corepack
      args:
        - yarn
        - test:server
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: Server tests need a migrated test database; use `test:full` when you want the Makefile-owned reset path.
  test:full:
    context: host
    description: Run the repository Makefile test path
    command:
      exe: make
      args:
        - test
    effects:
      external_state:
        - docker
    requirements:
      tools:
        make: "*"
        docker: "*"
    notes: Starts Postgres and resets the test database through the upstream Makefile.
  verify:
    description: Run the lean PR-safe verification path
    aggregate:
      tasks:
        - lint
        - typecheck
        - test:app
        - test:shared
    safe_for_agent: true
    notes: Use this as the lean contributor verification path before proposing changes; run `format:check` separately when formatting drift is in scope.
  dev:
    context: host
    description: Start the documented local development loop
    run: make up
    effects:
      writes:
        - node_modules
        - .yarn/install-state.gz
      network: true
      network_kind: dependency_hydration
      external_state:
        - docker
    requirements:
      tools:
        make: "*"
        docker: "*"
    notes: Mirrors the repo Makefile `up` target, including Redis/Postgres startup and local SSL setup.
workflows:
  default: checks
  checks:
    intent: ci_validation
    description: Lean PR validation path for app/shared changes
    setup:
      task: setup
    run:
      task: verify
    notes: Use this for normal contributor verification before a full service-backed test run.
  server:
    intent: ci_validation
    description: Backend test path that needs the Postgres service
    setup:
      task: setup
    run:
      task: test:server
    notes: Use this when server or shared backend code changes need database-backed tests and the database is already prepared.
  app:
    intent: local_development
    description: Documented Makefile development startup path
    run:
      task: dev
    notes: Use this for the full local development loop, not for quick PR validation.
checks:
  - name: workspace-dependencies-installed
    kind: file
    severity: error
    path: .yarn/install-state.gz
    expect: file
    timeout: 10000
agent:
  posture: readiness_strict
  default_task: verify
  safe_tasks:
    - lint
    - typecheck
    - test:app
    - test:shared
    - verify
  verify_after_changes:
    - verify
  writable_paths:
    - __mocks__
    - app
    - docs
    - node_modules
    - plugins
    - public
    - server
    - shared
    - .yarn/install-state.gz
  protected_paths:
    - .env
    - .env.development
    - .env.local
    - .env.production
    - .env.sample
    - .env.test
    - .github/workflows
    - .nvmrc
    - .yarnrc.yml
    - docker-compose.yml
    - Dockerfile
    - Dockerfile.base
    - Makefile
    - ota.yaml
    - package.json
    - yarn.lock
  bootstrap:
    ota:
      note: Install ota only when missing so contributors and agents can use the readiness workflows declared here.
      source:
        kind: git_rev
        rev: 5bcf0509df09b2ecbbd0c8d6bc111e73b82a0c7f
  notes: |
    This contract intentionally scopes Outline to a local contributor slice: dependency install,
    app/shared checks, backend test entrypoints, and the documented Makefile development path.
    Use `ota tasks --safe --use` to see the commands agents are allowed to run.
    Use `ota up --workflow checks` on a fresh checkout so Ota runs setup before verification.
    Use `ota up --workflow checks --container` to run the same check path through the declared
    Node container context; native remains the default.
    Use `ota run format:check` only when formatting drift is intentionally in scope; it is kept
    outside the default agent proof path because the current upstream tree is not Prettier-clean.
    Use `ota run verify` after dependencies are already installed.
    Use `ota run test:full` only when Docker-backed database reset is intended.
    Use `ota up --workflow app` when you want the documented local development loop.
    Do not edit env files, lockfiles, Docker files, Makefile, CI workflows, or this contract unless
    the maintainer explicitly asks for contract or infrastructure authoring.
