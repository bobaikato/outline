# ota:managed-github-projection v1 identity=sha256:43ba74a43cd38a1c5f73a42f1ca08a8776eae5eb531385c6b7edea6217404b66
name: Ota governance ('checks')

on:
  workflow_call:
    inputs:
      ota_projection_identity:
        description: Ota-managed projection identity
        required: true
        type: string
      ota_runner:
        description: GitHub runner selected by the human-owned caller
        required: false
        default: 'macos-latest'
        type: string
      ota_target_os:
        description: Target operating system bound into the Ota projection
        required: true
        type: string

jobs:
  ota_ota_verify_verify:
    name: 'ota.verify.verify (macos/native)'
    runs-on: ${{ inputs.ota_runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184
        with:
          source: contract
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Verify Ota projection identity
        run: ota ci projection --workflow 'checks' --mode native --target-os ${{ inputs.ota_target_os }} --expect-identity ${{ inputs.ota_projection_identity }} --json
      - name: Validate contract
        run: ota validate . --json
      - name: Diagnose contract lane
        run: ota doctor --workflow 'checks' --mode native --json
      - name: Discover safe execution surface
        run: ota tasks --safe --use --json
      - name: Preview contract lane
        run: ota up --workflow 'checks' --mode native --agent --dry-run --json
      - name: Prepare contract lane
        run: ota up --workflow 'checks' --mode native --agent --json
      - name: Execute finite contract task
        run: ota run 'verify' --mode native --agent
      - name: Archive workflow readiness receipt
        run: ota receipt --workflow 'checks' --mode native --archive --json
