name: 'Test: Ota contract matrix'

on:
  workflow_dispatch:
    inputs:
      ota_repository:
        description: Ota source repository to build for this matrix run
        required: false
        default: ota-run/ota
      ota_ref:
        description: Ota branch, tag, or commit to build for this matrix run
        required: false
        default: 1.6.18-implementation
  pull_request:
    paths:
      - 'ota.yaml'
      - '.github/workflows/test-ota-contract-matrix.yml'
  push:
    paths:
      - 'ota.yaml'
      - '.github/workflows/test-ota-contract-matrix.yml'

concurrency:
  group: ota-contract-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: '1'

jobs:
  contract:
    name: Ota Contract Matrix (${{ matrix.name }} | native+container)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-node24
            os: ubuntu-latest
            docker_ready: true
          - name: macos-node24
            os: macos-latest
            docker_ready: false
          - name: windows-node24
            os: windows-latest
            docker_ready: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          yarn --version

      - name: Install ota from source
        uses: ota-run/ota/.github/actions/install-ota-from-source@v1.6.16
        with:
          repository: ${{ github.event.inputs.ota_repository || 'ota-run/ota' }}
          ref: ${{ github.event.inputs.ota_ref || '1.6.18-implementation' }}

      - name: Contract gates
        shell: bash
        run: |
          mkdir -p .ota/ci
          ota validate --json . > .ota/ci/validate.json
          ota validate .
          ota tasks --safe --use .
          ota tasks --workflow checks .
          ota tasks --workflow server .
          ota tasks --workflow app .
          ota execution topology --json . > .ota/ci/execution-topology.json

      - name: Dry-run checks workflow (native)
        shell: bash
        run: |
          ota up --workflow checks --dry-run --json . > .ota/ci/up-checks-dry-run.json

      - name: Dry-run checks workflow (container)
        shell: bash
        run: |
          ota up --workflow checks --container --dry-run --json . > .ota/ci/up-checks-container-dry-run.json

      - name: Dry-run server workflow (native)
        shell: bash
        run: |
          ota up --workflow server --dry-run --json . > .ota/ci/up-server-dry-run.json

      - name: Dry-run app workflow (repo Docker path)
        if: ${{ matrix.docker_ready }}
        shell: bash
        run: |
          ota up --workflow app --dry-run --json . > .ota/ci/up-app-dry-run.json

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-${{ matrix.name }}
          include-hidden-files: true
          path: .ota/ci/
          retention-days: 7
