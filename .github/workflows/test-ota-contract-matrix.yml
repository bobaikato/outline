name: 'Test: Ota contract matrix'

on:
  workflow_dispatch:
    inputs:
      ota_repository:
        description: Ota source repository to build for this matrix run
        required: false
        default: ota-run/ota
      ota_ref:
        description: Ota branch, tag, or commit to build for this matrix run
        required: false
        default: c37990ba
  pull_request:
    paths:
      - 'ota.yaml'
      - '.github/workflows/test-ota-contract-matrix.yml'
  push:
    paths:
      - 'ota.yaml'
      - '.github/workflows/test-ota-contract-matrix.yml'

concurrency:
  group: ota-contract-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: '1'

jobs:
  contract:
    name: Ota Contract Matrix (${{ matrix.name }} | native+container)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-node24
            os: ubuntu-latest
            docker_ready: true
            full_proof: true
          - name: macos-node24
            os: macos-latest
            docker_ready: false
            full_proof: false
          - name: windows-node24
            os: windows-latest
            docker_ready: false
            full_proof: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          yarn --version

      - name: Install ota from source
        id: install_ota_from_source
        continue-on-error: true
        uses: ota-run/ota/.github/actions/install-ota-from-source@c37990ba
        with:
          repository: ${{ github.event.inputs.ota_repository || 'ota-run/ota' }}
          ref: ${{ github.event.inputs.ota_ref || 'c37990ba' }}

      - name: Retry ota source install when cargo registry download flakes
        if: ${{ steps.install_ota_from_source.outcome == 'failure' }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if CARGO_HTTP_MULTIPLEXING=false CARGO_NET_RETRY=10 cargo install --path ".ota-source" --locked --force; then
              ota --version
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "ota source install retry failed"
          exit 1

      - name: Contract gates
        shell: bash
        run: |
          mkdir -p .ota/ci
          ota validate --json . > .ota/ci/validate.json
          ota validate .
          ota doctor --json . > .ota/ci/doctor.json
          ota doctor .
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --workflow checks .
          ota tasks --workflow server .
          ota tasks --workflow app .
          ota execution topology --json . > .ota/ci/execution-topology.json

      - name: Dry-run verify task (native)
        shell: bash
        run: |
          ota run verify --native --dry-run --json . > .ota/ci/run-verify-dry-run.json

      - name: Dry-run checks workflow (native)
        shell: bash
        run: |
          ota up --workflow checks --dry-run --json . > .ota/ci/up-checks-dry-run.json

      - name: Dry-run checks workflow (container, runnable host)
        if: ${{ matrix.docker_ready }}
        shell: bash
        run: |
          ota up --workflow checks --container --dry-run --json . > .ota/ci/up-checks-container-dry-run.json

      - name: Assert checks workflow container dry-run blocks without container engine
        if: ${{ !matrix.docker_ready }}
        shell: bash
        run: |
          set +e
          ota up --workflow checks --container --dry-run --json . > .ota/ci/up-checks-container-dry-run.json
          status=$?
          set -e
          STATUS="$status" node - <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('.ota/ci/up-checks-container-dry-run.json', 'utf8'));
          const status = Number.parseInt(process.env.STATUS || '0', 10);
          if (status === 0 || report.preview_status !== 'BLOCKED') {
            console.error(JSON.stringify({ status, preview_status: report.preview_status, summary: report.summary }, null, 2));
            process.exit(1);
          }
          const summary = report.summary?.primary_blocker?.summary || '';
          const why = report.summary?.primary_blocker?.why || '';
          const containerBackendBlocker = /container execution backend/i.test(summary) || /container engine/i.test(summary);
          const runtimeProbeImageMismatch =
            /runtime probe failed:/i.test(summary) &&
            (/no matching manifest/i.test(why) || /does not publish a windows manifest/i.test(why));
          if (!containerBackendBlocker && !runtimeProbeImageMismatch) {
            console.error(JSON.stringify(report.summary, null, 2));
            process.exit(1);
          }
          JS

      - name: Dry-run server workflow (native)
        shell: bash
        run: |
          ota up --workflow server --dry-run --json . > .ota/ci/up-server-dry-run.json

      - name: Dry-run app workflow (repo Docker path)
        if: ${{ matrix.docker_ready }}
        shell: bash
        run: |
          ota up --workflow app --dry-run --json . > .ota/ci/up-app-dry-run.json

      - name: Execute native smoke tasks (cross-OS non-Ubuntu)
        if: ${{ !matrix.full_proof }}
        timeout-minutes: 45
        shell: bash
        run: |
          ota run verify --native --stream .

      - name: Execute checks workflow setup (native, Ubuntu proof)
        if: ${{ matrix.full_proof }}
        timeout-minutes: 45
        shell: bash
        run: |
          ota up --workflow checks --stream .

      - name: Execute checks task chain (native, Ubuntu proof)
        if: ${{ matrix.full_proof }}
        timeout-minutes: 45
        shell: bash
        run: |
          ota run verify --stream .

      - name: Execute checks workflow setup (container, Ubuntu proof)
        if: ${{ matrix.full_proof }}
        timeout-minutes: 45
        shell: bash
        run: |
          ota up --workflow checks --container --stream .

      - name: Execute checks task chain (container, Ubuntu proof)
        if: ${{ matrix.full_proof }}
        timeout-minutes: 45
        shell: bash
        run: |
          ota run verify --container --stream .

      - name: Dry-run all non-internal tasks (native coverage lane)
        if: ${{ matrix.full_proof }}
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          ota tasks --json . > .ota/ci/tasks-all.json
          jq -c '
            .tasks[]
            | select((.internal // false) == false)
            | {
                name: .name,
                supports_native: (
                  if (.modes | type) == "array" then
                    any(.modes[]?; .mode == "native")
                  else
                    ((.default_mode // "native") == "native")
                  end
                ),
                runtime_native: (
                  if (.modes | type) == "array" then
                    any(.modes[]?; .mode == "native" and ((.has_runtime // false) == true))
                  else
                    false
                  end
                )
              }
            | select(.supports_native)
          ' .ota/ci/tasks-all.json > .ota/ci/tasks-native.jsonl
          while IFS= read -r task_line; do
            task_name="$(jq -r '.name' <<<"$task_line")"
            runtime_native="$(jq -r '.runtime_native' <<<"$task_line")"
            echo ">>> [native] ${task_name} (runtime=${runtime_native})"
            if [ "$runtime_native" = "true" ]; then
              ota run --native --dry-run --json "$task_name" .
            else
              ota run --native --dry-run --json "$task_name" .
            fi
          done < .ota/ci/tasks-native.jsonl

      - name: Dry-run all non-internal tasks (container coverage lane)
        if: ${{ matrix.full_proof }}
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          ota tasks --json . > .ota/ci/tasks-all.json
          jq -c '
            .tasks[]
            | select((.internal // false) == false)
            | {
                name: .name,
                supports_container: (
                  if (.modes | type) == "array" then
                    any(.modes[]?; .mode == "container")
                  else
                    ((.default_mode // "native") == "container")
                  end
                ),
                runtime_container: (
                  if (.modes | type) == "array" then
                    any(.modes[]?; .mode == "container" and ((.has_runtime // false) == true))
                  else
                    false
                  end
                )
              }
            | select(.supports_container)
          ' .ota/ci/tasks-all.json > .ota/ci/tasks-container.jsonl
          while IFS= read -r task_line; do
            task_name="$(jq -r '.name' <<<"$task_line")"
            runtime_container="$(jq -r '.runtime_container' <<<"$task_line")"
            echo ">>> [container] ${task_name} (runtime=${runtime_container})"
            if [ "$runtime_container" = "true" ]; then
              ota run --container --dry-run --json "$task_name" .
            else
              ota run --container --dry-run --json "$task_name" .
            fi
          done < .ota/ci/tasks-container.jsonl

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-${{ matrix.name }}
          include-hidden-files: true
          path: .ota/ci/
          retention-days: 7
