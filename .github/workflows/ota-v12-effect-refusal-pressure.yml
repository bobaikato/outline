name: Ota V12 Effect Refusal Pressure

on:
  push:
    branches:
      - bobai/v12-effect-refusal-pressure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refusal-pressure:
    name: Ota typed PostgreSQL refusal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Ota from contract source
        uses: ota-run/setup@v1
        with:
          source: contract

      - name: Create pressure artifact directory
        run: mkdir -p .ota/pressure/effect-refusal

      - name: Validate the pressure contract
        run: ota validate ota.yaml --json > .ota/pressure/effect-refusal/validate.json

      - name: Report bounded effect-refusal coverage
        run: |
          set +e
          ota doctor --json > .ota/pressure/effect-refusal/doctor.json
          status=$?
          set -e
          # Doctor may be ready (0) or report repo-owned readiness blockers (1).
          # The retained JSON, not readiness alone, carries this pressure evidence.
          test "$status" -eq 0 || test "$status" -eq 1

      - name: Challenge the explicit migration task refusal
        run: |
          ota run --agent --expect-effect-refusal ci_schema_refusal --json db:migrate \
            > .ota/pressure/effect-refusal/task-canary.json

      - name: Challenge the selected CI workflow refusal
        run: |
          ota up --workflow server-ci --agent --expect-effect-refusal ci_schema_refusal --json \
            > .ota/pressure/effect-refusal/workflow-canary.json

      - name: Require execution-free explicit denials
        run: |
          jq -e '.ok == true and .canary.status == "passed" and .canary.execution_started == false' \
            .ota/pressure/effect-refusal/task-canary.json
          jq -e '.ok == true and .canary.status == "passed" and .canary.execution_started == false' \
            .ota/pressure/effect-refusal/workflow-canary.json

      - name: Require static coverage honesty
        run: |
          jq -e '
            .claim_assurance
            | map(select(.family == "effect_refusal_assurance"))
            | length == 1
          ' .ota/pressure/effect-refusal/doctor.json
          jq -e '
            .claim_assurance[]
            | select(.family == "effect_refusal_assurance")
            | .assurance.status == "unknown"
              and ([.assurance.coverage_records[] | select(.kind == "equivalent_execution_path" and .status == "not_proved")] | length >= 1)
              and ([.assurance.coverage_records[] | select(.kind == "opaque_execution_paths" and .status == "not_proved")] | length == 1)
              and ([.assurance.gaps[] | select(startswith("equivalent_execution_paths_not_proved:sha256:"))] | length >= 1)
              and (.assurance.gaps | index("opaque_execution_paths_not_enumerated") != null)
          ' .ota/pressure/effect-refusal/doctor.json

      - name: Prove a generic refusal cannot pass the canary
        run: |
          set +e
          ota run --agent --expect-effect-refusal ci_schema_refusal --mode native --json db:migrate \
            > .ota/pressure/effect-refusal/generic-refusal.json
          status=$?
          set -e
          test "$status" -ne 0
          jq -e '.ok == false and .canary.status != "passed"' \
            .ota/pressure/effect-refusal/generic-refusal.json

      - name: Retain Ota pressure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-v12-effect-refusal-pressure-${{ github.run_id }}
          path: .ota/pressure/effect-refusal
          if-no-files-found: error
