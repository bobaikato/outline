version: 1

metadata:
  ota:
    minimum_version: 1.6.27

project:
  name: outline-v12-effect-pressure
  type: pressure_fixture

resource_bindings:
  ci_postgresql:
    kind: database
    provider: postgresql
    namespace:
      authority: dns:github.com
      organization: outline
      repository: outline
      environment: ci

effect_definitions:
  ci_schema_migration:
    kind: database_schema_mutation
    action: apply_migration_set
    resource:
      engine: postgresql
      target_ref: ci_postgresql
      schema: public
    bounds:
      migration_set:
        root: server/migrations
        content_identity: sha256:e2cb761546f9bac06bb8f1acf027169ff0fee07ab9eae41e3adc891dd5253f8c
      start_state: any_within_set

tasks:
  pressure:setup-probe:
    description: Witness whether workflow setup begins before typed-effect refusal.
    command:
      exe: sh
      args: ["-c", "touch .ota/pressure/effect-refusal/setup-path-entered"]
  pressure:provider-database-probe:
    description: Witness whether the selected provider/database precursor path begins.
    command:
      exe: sh
      args: ["-c", "touch .ota/pressure/effect-refusal/provider-database-path-entered"]
  pressure:worktree-child-probe:
    description: Witness whether a selected child can begin worktree mutation.
    command:
      exe: sh
      args: ["-c", "touch .ota/pressure/effect-refusal/worktree-child-path-entered"]
  pressure:hook-probe:
    description: Witness whether an outcome hook begins after typed-effect refusal.
    command:
      exe: sh
      args: ["-c", "touch .ota/pressure/effect-refusal/hook-path-entered"]
  db:migrate:
    description: Model the committed Sequelize migration step in server CI.
    depends_on: [pressure:provider-database-probe, pressure:worktree-child-probe]
    after_always: [pressure:hook-probe]
    action:
      kind: database_schema_mutation
      effect: ci_schema_migration
    effects:
      declared: [ci_schema_migration]
  db:migrate-unproved:
    description: Retain a same-effect migration attachment outside the canary challenge set.
    action:
      kind: database_schema_mutation
      effect: ci_schema_migration
    effects:
      declared: [ci_schema_migration]
  ci:migration-wrapper:
    description: Deliberately opaque raw-shell migration wrapper; it is not an effect declaration.
    command:
      exe: sh
      args: ["-c", "yarn sequelize db:migrate"]
  ci:test-server:
    description: Mirror the existing server-test CI lane after its migration prerequisite.
    depends_on: [db:migrate]
    command:
      exe: yarn
      args:
        - test:server
        - --maxWorkers=2
        - --shard=1/4

workflows:
  default: server-ci
  server-ci:
    intent: ci_validation
    setup:
      task: pressure:setup-probe
    run:
      task: ci:test-server

agent:
  bootstrap:
    ota:
      source:
        kind: git_rev
        rev: e96cad13db9e4289c0985fca2ce6d8353a896da4
  notes: |
    Use `ota tasks --safe --use` to inspect the canonical runnable surface first. This pressure
    contract intentionally has no agent-safe migration lane: its selected controls must refuse.
  effect_refusal_canaries:
    - id: ci_schema_refusal
      effect: ci_schema_migration
      challenge_lanes:
        - task: db:migrate
          origin:
            task: db:migrate
            effect: ci_schema_migration
        - workflow: server-ci
          origin:
            task: db:migrate
            effect: ci_schema_migration
    - id: ci_schema_archive_refusal
      effect: ci_schema_migration
      challenge_lanes:
        - workflow: server-ci
          origin:
            task: db:migrate
            effect: ci_schema_migration
